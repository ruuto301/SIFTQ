version: "3"

tasks:
  release:plan:
    desc: Print a read-only release plan.
    cmds:
      - uv run python scripts/release_deploy.py plan {{.CLI_ARGS}}

  release:create:
    desc: Create and push an annotated release tag at the checked-out SHA.
    cmds:
      - uv run python scripts/release_deploy.py release {{.CLI_ARGS}}

  deploy:plan:
    desc: Print deployment prerequisites without changing state.
    cmds:
      - uv run python scripts/release_deploy.py plan {{.CLI_ARGS}}

  deploy:release:
    desc: Verify a release tag and deploy the Worker.
    cmds:
      - uv run python scripts/release_deploy.py deploy {{.CLI_ARGS}}

  deploy:
    desc: Deploy the Worker to Cloudflare without changing secrets.
    cmds:
      - bun x cf deploy

  deploy:secrets:
    desc: Set or rotate Worker auth secrets directly on the Worker.
    cmds:
      - uv run python scripts/release_deploy.py secrets {{.CLI_ARGS}}
